# SECURITY NOTE: D1/KV/R2 IDs below are resource identifiers, not secrets.
# Never put passwords, JWT secrets or API keys in this file.
# Set secrets with: wrangler secret put ADMIN_PASSWORD / ADMIN_JWT_SECRET / DEEPSEEK_API_KEY
# account_id is intentionally omitted - wrangler resolves it from your logged-in account.

name = "rtb-exam-platform"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static asset configuration for Astro client output
assets = { directory = "./dist", binding = "ASSETS" }

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "rtb-exam-db"
database_id = "d56b1e23-63cd-43d2-9705-a5fa51300427"
migrations_dir = "./migrations"

# Cloudflare R2 Bucket Binding (for CSVs & Backups)
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "rtb-exam-assets"

# Cloudflare KV Namespace Binding (for Edge Rate Limiting & Settings)
[[kv_namespaces]]
binding = "EDGE_KV"
id = "9c53fe7363334755992a81e61675573d"

# Cloudflare Queues Binding (optional for async batch jobs on Workers Paid)
# [[queues.producers]]
# binding = "JOBS_QUEUE"
# queue = "rtb-async-jobs"

[vars]
ENVIRONMENT = "production"
PUBLIC_SITE_NAME = "RBT Practice Exam"
PUBLIC_SITE_URL = "https://rbtpracticeexam.xyz"
